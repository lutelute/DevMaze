appId: com.pwslab.devmaze
productName: DevMaze
copyright: Copyright © 2026 PWS Lab

directories:
  output: release/${version}
  buildResources: build

# main / preload / renderer はすべて束ね済みなので node_modules は要らない
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!node_modules/**/*"

mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools

win:
  target:
    - nsis
    - portable

linux:
  target:
    - AppImage
    - deb
  category: Development

publish:
  provider: github
  owner: lutelute
  repo: DevMaze
